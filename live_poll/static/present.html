<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Poll Projector Display</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="present-wrap">
    <header class="present-head">
      <div>
        <div class="topbar"></div>
        <p id="poll-tag" class="tag">POLL</p>
        <h1 id="poll-question" class="present-question">Loading...</h1>
      </div>
      <aside class="qr-card">
        <img src="/qr.png" alt="Scan QR code to vote anonymously">
        <div id="join-url" class="qr-url"></div>
      </aside>
    </header>

    <section id="chart-area" class="chart"></section>

    <footer class="present-foot">
      <div id="total-votes" class="vote-counter">0 anonymous responses</div>
      <div class="controls">
        <button class="ctrl-btn" onclick="admin('prev')">Prev</button>
        <button id="reveal-btn" class="ctrl-btn" onclick="admin('toggle_reveal')">Hide Results</button>
        <button class="ctrl-btn" onclick="admin('reset')">Reset</button>
        <button class="ctrl-btn ctrl-btn--primary" onclick="admin('next')">Next Poll</button>
      </div>
    </footer>
  </main>

  <script>
    async function admin(action) {
      const res = await fetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action }),
      });
      if (res.ok) render(await res.json());
    }

    function render(state) {
      const p = state.poll;
      document.getElementById("poll-tag").textContent = p.tag;
      document.getElementById("poll-question").textContent = p.question;
      document.getElementById("join-url").textContent = state.join_url;
      document.getElementById("total-votes").textContent =
        `${p.total_votes} anonymous response${p.total_votes === 1 ? "" : "s"}`;
      document.getElementById("reveal-btn").textContent =
        state.reveal_results ? "Hide Results" : "Reveal Results";

      const area = document.getElementById("chart-area");
      if (!state.reveal_results) {
        area.innerHTML = `<div class="hidden-note">Voting in progress on your phone &mdash; results hidden until reveal</div>`;
        return;
      }

      const denom = Math.max(p.total_votes, 1);
      area.innerHTML = p.options
        .map((label, idx) => {
          const count = p.counts[idx] || 0;
          const pct = Math.round((count / denom) * 100);
          return `
            <div class="bar-row">
              <div class="bar-meta">
                <span>${label}</span>
                <span class="bar-count">${count} (${pct}%)</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width: ${pct}%;"></div>
              </div>
            </div>
          `;
        })
        .join("");
    }

    async function sync() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (res.ok) render(await res.json());
      } catch (_) {}
    }

    sync();
    setInterval(sync, 1000);
  </script>
</body>
</html>
