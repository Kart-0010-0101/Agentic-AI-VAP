<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anonymous Classroom Poll</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="vote-wrap">
    <section>
      <div class="topbar"></div>
      <p id="poll-tag" class="tag">POLL</p>
      <h1 id="poll-question" class="question">Loading poll...</h1>
      <div id="options-list" class="options"></div>
      <div id="vote-status" class="status-banner" role="status">
        Response recorded anonymously. Wait for the next question.
      </div>
    </section>
    <footer class="foot-note">
      Anonymous session &mdash; no sign-in or personal details collected.
    </footer>
  </main>

  <script>
    let lastPollKey = "";

    function voteKey(pollId) {
      return `vap_poll_choice_${pollId}`;
    }

    async function submitVote(pollId, idx) {
      if (localStorage.getItem(voteKey(pollId)) !== null) return;
      const res = await fetch("/api/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ poll_id: pollId, option_idx: idx }),
      });
      if (res.ok) {
        localStorage.setItem(voteKey(pollId), String(idx));
        const state = await res.json();
        render(state);
      }
    }

    function render(state) {
      const p = state.poll;
      const saved = localStorage.getItem(voteKey(p.id));
      const stateKey = `${p.id}|${saved ?? ""}|${p.options.length}`;
      if (stateKey === lastPollKey) return;
      lastPollKey = stateKey;

      document.getElementById("poll-tag").textContent = p.tag;
      document.getElementById("poll-question").textContent = p.question;

      const list = document.getElementById("options-list");
      list.innerHTML = "";
      p.options.forEach((label, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt-btn" + (saved === String(idx) ? " selected" : "");
        btn.disabled = saved !== null;
        btn.textContent = label;
        btn.addEventListener("click", () => submitVote(p.id, idx));
        list.appendChild(btn);
      });

      const banner = document.getElementById("vote-status");
      banner.classList.toggle("visible", saved !== null);
    }

    async function sync() {
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (res.ok) render(await res.json());
      } catch (_) {}
    }

    sync();
    setInterval(sync, 1500);
  </script>
</body>
</html>
