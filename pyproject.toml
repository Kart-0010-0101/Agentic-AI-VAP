[project]
name = "agentic-ai-vap"
version = "0.1.0"
description = "5-Day VAP Day 1: Environment check, ChromaDB sandbox, and anonymous live phone poll"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=0.6.0",
    "duckduckgo-search>=7.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "qrcode[pil]>=8.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
